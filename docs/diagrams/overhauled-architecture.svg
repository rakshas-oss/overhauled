<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">OVERHAULED // BROKER WORKER FABRIC + EXECUTION</title><desc id="desc">Overhauled validates BRK1/BRK2, applies bounded admission, schedules five worker classes across validated process-cpuset → NUMA → LLC/CPU-group hierarchy with bounded elastic capacity, applies best-effort Linux affinity, dispatches CPU/GPU/NPU and reports worker telemetry.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081522"/><stop offset=".6" stop-color="#17112e"/><stop offset="1" stop-color="#09222a"/></linearGradient><linearGradient id="hd"><stop stop-color="#00d9ff"/><stop offset=".55" stop-color="#a47bff"/><stop offset="1" stop-color="#ffb25d"/></linearGradient><pattern id="gr" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9ab3ca" stroke-opacity=".07"/></pattern><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-size:29px;font-weight:700;fill:#f4f7ff}.s{font-size:13.5px;fill:#aebfd0}.sec{font-size:15px;font-weight:700;letter-spacing:1px;fill:#e0edff}.ch{font-weight:700;fill:#fff}.b{fill:#d8e4ef}.sm{font-size:10.8px;fill:#a8bacb}</style></defs><rect width="1440" height="900" rx="22" fill="url(#bg)"/><rect width="1440" height="900" rx="22" fill="url(#gr)"/><rect x="20" y="20" width="1400" height="92" rx="14" fill="#101d31" stroke="url(#hd)" stroke-width="2"/><text x="48" y="58" class="h">OVERHAULED // BROKER WORKER FABRIC + EXECUTION</text><text x="50" y="86" class="s">v1.3.0 candidate · hierarchical CPU-group fabric · bounded large-host scaling · accelerator dispatch</text><text x="1390" y="58" text-anchor="end" font-size="12" fill="#6cecf1">ANSI TRUE-COLOUR MAP</text><rect x="24" y="132" width="205" height="620" rx="15" fill="#111d2e" stroke="#54738a"/><text x="44" y="164" class="sec">CLIENTS</text><rect x="42" y="184" width="169" height="82" rx="11" fill="#123d4d" stroke="#4dd9eb" stroke-width="1.4"/><text x="60" y="212" class="ch" font-size="13">YuKKi adapter</text><text x="60" y="236" class="b" font-size="11">BRK2 + WSM1 data</text><rect x="42" y="280" width="169" height="82" rx="11" fill="#3b2a57" stroke="#b69aff" stroke-width="1.4"/><text x="60" y="308" class="ch" font-size="13">WASM bench</text><text x="60" y="332" class="b" font-size="11">direct BRK2 inference</text><rect x="42" y="376" width="169" height="82" rx="11" fill="#4a3a1e" stroke="#ffd17c" stroke-width="1.4"/><text x="60" y="404" class="ch" font-size="13">Other callers</text><text x="60" y="428" class="b" font-size="11">BRK1 / BRK2</text><text x="44" y="510" class="sm">BRK1 / omitted worker class</text><text x="44" y="530" class="sm">→ legacy Throughput queue.</text><text x="44" y="575" class="sm">Raw TCP has no authentication</text><text x="44" y="595" class="sm">or TLS. Use trusted network /</text><text x="44" y="615" class="sm">independently secured proxy.</text><text x="44" y="662" class="sm">Not a Wasm runtime or control plane.</text><rect x="250" y="132" width="876" height="620" rx="15" fill="#171b2d" stroke="#ffbd7d" stroke-width="2"/><text x="272" y="164" class="sec">BROKER SERVER // TCP :9090</text><rect x="272" y="184" width="832" height="68" rx="11" fill="#58321d" stroke="#ffbd7d" stroke-width="1.4"/><text x="290" y="212" class="ch" font-size="16">Frame decode + validation</text><text x="290" y="236" class="b" font-size="12">4-byte BE length · BRK1 compatibility · BRK2 TLV · bounded fields</text><rect x="272" y="264" width="832" height="76" rx="11" fill="#29384a" stroke="#90a9c8" stroke-width="1.4"/><text x="290" y="292" class="ch" font-size="16">Bounded admission + budgets</text><text x="290" y="316" class="b" font-size="12">per-client in-flight ceiling · process-wide request count + payload-memory accounting</text><rect x="272" y="352" width="832" height="180" rx="11" fill="#2b2342" stroke="#b69aff"/><text x="292" y="382" class="ch" font-size="15">Five class queues × NUMA × LLC / CPU-group leaves</text><rect x="292" y="402" width="144" height="34" rx="7" fill="#174154" stroke="#55ddeb"/><text x="364" y="424" text-anchor="middle" class="b">Control</text><rect x="447" y="402" width="144" height="34" rx="7" fill="#493060" stroke="#b69aff"/><text x="519" y="424" text-anchor="middle" class="b">RealtimeSpatial</text><rect x="602" y="402" width="144" height="34" rx="7" fill="#4c3b1e" stroke="#ffd17c"/><text x="674" y="424" text-anchor="middle" class="b">Throughput</text><rect x="757" y="402" width="144" height="34" rx="7" fill="#244238" stroke="#73d9a8"/><text x="829" y="424" text-anchor="middle" class="b">ExactCpu</text><rect x="912" y="402" width="170" height="34" rx="7" fill="#203f65" stroke="#70b6ff"/><text x="997" y="424" text-anchor="middle" class="b">Inference</text><text x="292" y="463" class="b" font-size="12.2">Nested process cpuset → NUMA → LLC/CPU-group topology; per-class leaf queues.</text><text x="292" y="487" class="b" font-size="12.2">Validated nesting fails closed; CPU masks stay within process-allowed CPUs.</text><text x="292" y="513" class="sm">BRK2 fields 9 deadline · 11 class · 12 affinity · 13 preferred node (hint).</text><rect x="272" y="548" width="400" height="166" rx="11" fill="#14404a" stroke="#55ddeb" stroke-width="1.4"/><text x="290" y="576" class="ch" font-size="16">Hierarchical worker fabric</text><text x="290" y="600" class="b" font-size="11.5">process cpuset → NUMA → LLC / CPU-group hierarchy</text><text x="290" y="624" class="b" font-size="11.5">home group → sibling group → remote NUMA stealing</text><text x="290" y="648" class="b" font-size="11.5">bounded CPU masks + topology-local worker placement</text><text x="290" y="672" class="b" font-size="11.5">caps: 16,384 workers total · 4,096 elastic maximum</text><rect x="688" y="548" width="416" height="166" rx="11" fill="#193d32" stroke="#63dda7" stroke-width="1.4"/><text x="706" y="576" class="ch" font-size="16">Backend dispatch // separate decision</text><text x="706" y="600" class="b" font-size="11.5">CPU reference baseline / safe fallback</text><text x="706" y="624" class="b" font-size="11.5">CUDA GPU topology + Placer</text><text x="706" y="648" class="b" font-size="11.5">optional NPU / Ethos-U85 Linux DRM</text><text x="706" y="672" class="b" font-size="11.5">Control / ExactCpu never elastic; NPU simulator is CPU emulation</text><path d="M229 225H242" stroke="#54ddec" stroke-width="3"/><rect x="1146" y="132" width="270" height="620" rx="15" fill="#111b2b" stroke="#6cecf1"/><text x="1168" y="164" class="sec">RESPONSE</text><rect x="1166" y="184" width="230" height="170" rx="11" fill="#18384d" stroke="#55c7ff" stroke-width="1.4"/><text x="1184" y="212" class="ch" font-size="14">BRK2 telemetry</text><text x="1184" y="236" class="b" font-size="11.5">field 7 backend</text><text x="1184" y="259" class="b" font-size="11.5">field 8 worker class</text><text x="1184" y="282" class="b" font-size="11.5">9 queue wait · 10 service time</text><text x="1184" y="305" class="b" font-size="11.5">11 worker ID (1280–1343 = elastic)</text><text x="1184" y="328" class="b" font-size="11.5">12 applied NUMA node</text><rect x="1166" y="368" width="230" height="110" rx="11" fill="#493b20" stroke="#ffd17c" stroke-width="1.4"/><text x="1184" y="396" class="ch" font-size="14">BRK1 compatibility</text><text x="1184" y="420" class="b" font-size="11.5">no worker directive fields</text><text x="1184" y="443" class="b" font-size="11.5">no backend identity field</text><text x="1184" y="466" class="b" font-size="11.5">−1 GPU index ≠ CPU / NPU proof</text><rect x="1166" y="492" width="230" height="222" rx="11" fill="#302741" stroke="#b69aff" stroke-width="1.4"/><text x="1184" y="520" class="ch" font-size="14">Limits</text><text x="1184" y="544" class="b" font-size="11.5">64 MiB default in-flight memory</text><text x="1184" y="568" class="b" font-size="11.5">outstanding cap hard limit: 65,536</text><text x="1184" y="592" class="b" font-size="11.5">16,384 total / 4,096 elastic cap</text><text x="1184" y="616" class="b" font-size="11.5">cooperative deadlines; no preemption</text><text x="1184" y="640" class="b" font-size="11.5">no hard-real-time guarantee</text><rect x="24" y="776" width="1392" height="96" rx="13" fill="#111c2d" stroke="#647990"/><text x="46" y="805" class="sec">RESPONSIBILITY SPLIT</text><text x="46" y="833" class="b" font-size="12.5"><tspan fill="#6cecf1" font-weight="700">YUKKI-OS:</tspan><tspan> chooses worker class + logical affinity + deadline + preferred-node hint.</tspan></text><text x="720" y="833" class="b" font-size="12.5"><tspan fill="#ffbd7d" font-weight="700">OVERHAULED:</tspan><tspan> NUMA queues + admission + elastic caps + backend placement / telemetry.</tspan></text><text x="46" y="856" class="sm">Non-Linux / restricted hosts continue without claiming NUMA pinning; no NUMA-local allocation promise.</text></svg>