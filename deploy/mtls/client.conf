foreground = yes

[overhauled-broker-client]
client = yes
accept = 127.0.0.1:19090
connect = broker.example.net:9090
cert = /etc/stunnel/yukki-client-fullchain.pem
key = /etc/stunnel/private/yukki-client.key
CAfile = /etc/stunnel/overhauled-server-ca.pem
verifyChain = yes
checkHost = broker.example.net
sni = broker.example.net
sslVersionMin = TLSv1.3
