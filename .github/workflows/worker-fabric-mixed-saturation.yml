name: Worker Fabric Mixed-Class Saturation

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      runner_profile:
        description: "Use standard hosted runner or a self-hosted runner labelled linux/x64/numa"
        type: choice
        options:
          - standard
          - numa2
        default: standard
        required: true

permissions:
  contents: read

concurrency:
  group: worker-fabric-saturation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate saturation tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate benchmark driver and resource monitor
        run: |
          python3 -m py_compile \
            benchmarks/worker_fabric_saturation.py \
            benchmarks/process_resource_monitor.py \
            tests/test_worker_fabric_saturation.py
          python3 -m unittest discover -s tests -p 'test_worker_fabric_saturation.py' -v

  saturation:
    name: Release mixed-class pipelined A/B benchmark
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ${{ inputs.runner_profile == 'numa2' && fromJSON('["self-hosted","linux","x64","numa"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev python3

      - name: Record and validate runner topology
        env:
          RUNNER_PROFILE: ${{ inputs.runner_profile }}
        run: |
          set -euo pipefail
          {
            uname -a
            lscpu
            lscpu -p=NODE
            cat /sys/devices/system/node/online 2>/dev/null || true
            cat /sys/devices/system/node/node*/cpulist 2>/dev/null || true
          } | tee benchmark-topology.txt
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path("/sys/devices/system/node")
          allowed = set(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else set()
          nodes = []
          for path in sorted(root.glob("node[0-9]*")) if root.exists() else []:
              try:
                  cpus = set()
                  for part in (path / "cpulist").read_text().strip().split(","):
                      bounds = [int(x) for x in part.split("-")]
                      cpus.update(range(bounds[0], bounds[-1] + 1))
                  visible = sorted(cpus & allowed) if allowed else sorted(cpus)
                  if visible:
                      nodes.append({"id": int(path.name[4:]), "visible_cpus": visible})
              except (OSError, ValueError):
                  pass
          topology = {
              "runner_profile": os.environ["RUNNER_PROFILE"],
              "allowed_cpu_count": len(allowed) if allowed else os.cpu_count(),
              "numa_node_ids": [node["id"] for node in nodes],
              "numa_node_count": len(nodes),
              "nodes": nodes,
          }
          pathlib.Path("benchmark-topology.json").write_text(json.dumps(topology, indent=2) + "\n")
          print(json.dumps(topology, indent=2))
          if os.environ["RUNNER_PROFILE"] == "numa2" and len(nodes) < 2:
              sys.exit("NUMA validation requested, but fewer than two NUMA nodes are visible to this runner")
          PY

      - name: Prepare baseline and current main source trees
        env:
          BASE_SHA: accd334bd6964213cb6eb9c1eed295901b83b5e6
        run: |
          set -euo pipefail
          MERGED_SHA="$(git rev-parse origin/main)"
          echo "Comparing baseline $BASE_SHA against main $MERGED_SHA"
          mkdir -p /tmp/worker-fabric-src
          git worktree add /tmp/worker-fabric-src/baseline "$BASE_SHA"
          git worktree add /tmp/worker-fabric-src/merged "$MERGED_SHA"
          echo "MERGED_SHA=$MERGED_SHA" >> "$GITHUB_ENV"

      - name: Build optimized broker binaries
        run: |
          set -euo pipefail
          for variant in baseline merged; do
            cmake -S "/tmp/worker-fabric-src/$variant" -B "/tmp/worker-fabric-build/$variant" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_BROKER=ON \
              -DBUILD_TESTING=OFF \
              -DBUILD_EXAMPLES=OFF \
              -DENABLE_CUDA=OFF \
              -DENABLE_TENSORRT=OFF
            cmake --build "/tmp/worker-fabric-build/$variant" --target broker_server --parallel 2
          done

      - name: Run alternating baseline, dedicated, and elastic saturation trials
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          cpu_count="$(python3 -c 'import os; print(len(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else (os.cpu_count() or 1))')"
          throughput_workers=$((cpu_count > 4 ? cpu_count - 4 : 1))
          echo "CPU capacity=$cpu_count; dedicated workers=4+$throughput_workers; elastic budget sweep=1,2,4"
          port_index=0
          server_pid=""
          monitor_pid=""

          stop_server() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
            if [ -n "$monitor_pid" ]; then
              wait "$monitor_pid" 2>/dev/null || kill "$monitor_pid" 2>/dev/null || true
              monitor_pid=""
            fi
          }
          trap stop_server EXIT

          run_arm() {
            arm="$1"
            repetition="$2"
            variant="$3"
            elastic_budget="$4"
            port=$((19300 + port_index))
            port_index=$((port_index + 1))
            binary="/tmp/worker-fabric-build/$variant/broker_server"

            common_args=(
              --workers-control 1
              --workers-realtime 1
              --workers-throughput "$throughput_workers"
              --workers-exact-cpu 1
              --workers-inference 1
            )
            if [ "$elastic_budget" -gt 0 ]; then
              "$binary" "$port" "${common_args[@]}" \
                --workers-elastic "$elastic_budget" \
                --elastic-realtime-max "$elastic_budget" \
                --elastic-throughput-max "$elastic_budget" \
                --elastic-inference-max "$elastic_budget" \
                > "benchmark-results/$arm-r$repetition-server.log" 2>&1 &
            else
              "$binary" "$port" "${common_args[@]}" \
                > "benchmark-results/$arm-r$repetition-server.log" 2>&1 &
            fi
            server_pid=$!

            ready=0
            for _ in $(seq 1 80); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "benchmark-results/$arm-r$repetition-server.log"
                return 1
              fi
              if python3 -c "import socket; s=socket.create_connection(('127.0.0.1',$port),timeout=0.2); s.close()" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 0.25
            done
            if [ "$ready" -ne 1 ]; then
              cat "benchmark-results/$arm-r$repetition-server.log"
              return 1
            fi

            python3 benchmarks/process_resource_monitor.py \
              --pid "$server_pid" \
              --output "benchmark-results/$arm-r$repetition-resources.csv" \
              --interval 0.25 &
            monitor_pid=$!

            python3 benchmarks/worker_fabric_saturation.py \
              --host 127.0.0.1 --port "$port" \
              --client-counts 8 32 \
              --pipeline-depths 1 32 \
              --requests-per-client 256 \
              --warmup-requests-per-client 64 \
              --features 1024 \
              --timeout 30 \
              --seed "$repetition" \
              --output "benchmark-results/$arm-r$repetition.json"

            stop_server
          }

          for repetition in $(seq 1 10); do
            # Rotate all five configurations so no worker budget always runs
            # first or last. Baseline and dedicated-only remain controls.
            case "$(((repetition - 1) % 5))" in
              0) order=(baseline merged-dedicated elastic-1 elastic-2 elastic-4) ;;
              1) order=(merged-dedicated elastic-1 elastic-2 elastic-4 baseline) ;;
              2) order=(elastic-1 elastic-2 elastic-4 baseline merged-dedicated) ;;
              3) order=(elastic-2 elastic-4 baseline merged-dedicated elastic-1) ;;
              4) order=(elastic-4 baseline merged-dedicated elastic-1 elastic-2) ;;
            esac
            for arm in "${order[@]}"; do
              case "$arm" in
                baseline) run_arm baseline "$repetition" baseline 0 ;;
                merged-dedicated) run_arm merged-dedicated "$repetition" merged 0 ;;
                elastic-1) run_arm elastic-1 "$repetition" merged 1 ;;
                elastic-2) run_arm elastic-2 "$repetition" merged 2 ;;
                elastic-4) run_arm elastic-4 "$repetition" merged 4 ;;
              esac
            done
          done

      - name: Summarize trials and verify NUMA placement
        env:
          RUNNER_PROFILE: ${{ inputs.runner_profile }}
        run: |
          python3 - <<'PY'
          import csv, glob, json, math, statistics
          from pathlib import Path

          root = Path("benchmark-results")
          budgets = [1, 2, 4]
          arms = ["baseline", "merged-dedicated"] + [f"elastic-{budget}" for budget in budgets]
          classes = ["control", "realtime-spatial", "throughput", "exact-cpu", "inference"]
          repetitions = 10
          grouped = {arm: {} for arm in arms}
          summary = {"arms": {}, "comparisons": {}, "classes": classes,
                     "elastic_budgets": budgets, "repetitions": repetitions}

          for arm in arms:
              files = sorted(glob.glob(str(root / f"{arm}-r*.json")))
              if len(files) != repetitions:
                  raise SystemExit(f"{arm}: expected {repetitions} trial files, found {len(files)}")
              for file in files:
                  document = json.loads(Path(file).read_text())
                  for item in document["results"]:
                      key = (item["clients"], item["pipeline_depth"])
                      grouped[arm].setdefault(key, []).append(item)

          def median(arm, key, field):
              return statistics.median(item[field] for item in grouped[arm][key])

          def class_summary(items, class_name):
              entries = [item["per_class"][class_name] for item in items]
              return {
                  "requests_per_second_median": statistics.median(x["requests_per_second"] for x in entries),
                  "p50_latency_ms_median": statistics.median(x["p50_latency_ms"] for x in entries),
                  "p95_latency_ms_median": statistics.median(x["p95_latency_ms"] for x in entries),
                  "p99_latency_ms_median": statistics.median(x["p99_latency_ms"] for x in entries),
                  "p95_queue_wait_us_median": statistics.median(x["p95_queue_wait_us"] for x in entries),
                  "mean_service_time_us_median": statistics.median(x["mean_service_time_us"] for x in entries),
                  "elastic_worker_ids": sorted({w for x in entries for w in x["elastic_worker_ids"]}),
                  "numa_nodes": sorted({n for x in entries for n in x["numa_nodes"]}),
              }

          for arm in arms:
              summary["arms"][arm] = {}
              for key in sorted(grouped[arm]):
                  label = f"{key[0]}x{key[1]}"
                  items = grouped[arm][key]
                  rates = [item["requests_per_second"] for item in items]
                  summary["arms"][arm][label] = {
                      "trial_count": len(items),
                      "requests_per_second_median": statistics.median(rates),
                      "requests_per_second_min": min(rates),
                      "requests_per_second_max": max(rates),
                      "requests_per_second_mad_pct": (
                          statistics.median([abs(x - statistics.median(rates)) for x in rates]) /
                          statistics.median(rates) * 100
                      ),
                      "p50_latency_ms_median": median(arm, key, "p50_latency_ms"),
                      "p95_latency_ms_median": median(arm, key, "p95_latency_ms"),
                      "p99_latency_ms_median": median(arm, key, "p99_latency_ms"),
                      "p95_queue_wait_us_median": median(arm, key, "p95_queue_wait_us"),
                      "mean_service_time_us_median": median(arm, key, "mean_service_time_us"),
                      "per_class": {name: class_summary(items, name) for name in classes},
                  }

          for key in sorted(grouped["baseline"]):
              base = median("baseline", key, "requests_per_second")
              dedicated = median("merged-dedicated", key, "requests_per_second")
              label = f"{key[0]}x{key[1]}"
              comparison = {
                  "dedicated_vs_baseline_pct": (dedicated / base - 1) * 100,
              }
              for budget in budgets:
                  elastic = median(f"elastic-{budget}", key, "requests_per_second")
                  comparison[f"elastic_{budget}_vs_dedicated_pct"] = (
                      (elastic / dedicated - 1) * 100
                  )
                  comparison[f"elastic_{budget}_vs_baseline_pct"] = (
                      (elastic / base - 1) * 100
                  )
              summary["comparisons"][label] = comparison

          def resource_summary(path):
              samples = []
              if path.exists():
                  with path.open(newline="") as handle:
                      samples = list(csv.DictReader(handle))
              cpu_rates = []
              for previous, current in zip(samples, samples[1:]):
                  dt = float(current["monotonic_seconds"]) - float(previous["monotonic_seconds"])
                  dcpu = float(current["cpu_seconds_total"]) - float(previous["cpu_seconds_total"])
                  if dt > 0 and dcpu >= 0:
                      cpu_rates.append(dcpu / dt * 100.0)
              rss = [float(row["rss_mib"]) for row in samples]
              return {
                  "samples": len(samples),
                  "peak_cpu_percent_one_core": max(cpu_rates) if cpu_rates else None,
                  "mean_cpu_percent_one_core": statistics.mean(cpu_rates) if cpu_rates else None,
                  "peak_rss_mib": max(rss) if rss else None,
              }

          summary["resources"] = {
              arm: {
                  Path(file).stem: resource_summary(Path(file))
                  for file in sorted(glob.glob(str(root / f"{arm}-r*-resources.csv")))
              } for arm in arms
          }

          topology = json.loads(Path("benchmark-topology.json").read_text())
          summary["topology"] = topology
          eligible = ["realtime-spatial", "throughput", "inference"]
          # The smallest shared pools cannot meaningfully prove cross-node
          # distribution. Validate NUMA locality with dedicated plus max budget.
          numa_arms = ["merged-dedicated", "elastic-4"]
          numa_nodes = {
              arm: {
                  name: sorted({node for item in grouped[arm][(32, 32)]
                                for node in item["per_class"][name]["numa_nodes"]})
                  for name in eligible
              } for arm in numa_arms
          }
          numa_verified = topology["numa_node_count"] >= 2 and all(
              len(numa_nodes[arm][name]) >= 2 for arm in numa_nodes for name in eligible
          )
          summary["numa_validation"] = {
              "runner_node_count": topology["numa_node_count"],
              "validated_arms": numa_arms,
              "eligible_class_nodes_at_32_clients_depth_32": numa_nodes,
              "multi_node_worker_execution_verified": numa_verified,
          }

          rows = [
              "# Mixed-class pipelined worker-fabric budget sweep",
              "",
              "Release broker; 1,024 binary64 features per request; five worker classes; 64 warm-up requests/client/configuration; 256 measured requests/client; ten order-rotated repetitions.",
              "Elastic budgets are total shared-pool thread caps of 1, 2, and 4; each eligible class ceiling equals the selected cap.",
              "",
              "| Clients | Pipeline | Baseline req/s | Dedicated req/s | Elastic 1 | Elastic 2 | Elastic 4 | Dedicated vs baseline | E1 vs dedicated | E2 vs dedicated | E4 vs dedicated |",
              "|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for key in sorted(grouped["baseline"]):
              label = f"{key[0]}x{key[1]}"
              base = median("baseline", key, "requests_per_second")
              dedicated = median("merged-dedicated", key, "requests_per_second")
              elastic_rates = [median(f"elastic-{budget}", key, "requests_per_second")
                               for budget in budgets]
              compare = summary["comparisons"][label]
              rows.append(
                  f"| {key[0]} | {key[1]} | {base:,.0f} | {dedicated:,.0f} | "
                  f"{elastic_rates[0]:,.0f} | {elastic_rates[1]:,.0f} | {elastic_rates[2]:,.0f} | "
                  f"{compare['dedicated_vs_baseline_pct']:+.1f}% | "
                  f"{compare['elastic_1_vs_dedicated_pct']:+.1f}% | "
                  f"{compare['elastic_2_vs_dedicated_pct']:+.1f}% | "
                  f"{compare['elastic_4_vs_dedicated_pct']:+.1f}% |"
              )
          rows += ["", "## Per-class p95 queue wait at 32 clients / depth 32", "",
                   "| Class | Dedicated (µs) | Elastic 1 (µs) | Elastic 2 (µs) | Elastic 4 (µs) |",
                   "|---|---:|---:|---:|---:|"]
          for name in classes:
              dedicated_wait = summary["arms"]["merged-dedicated"]["32x32"]["per_class"][name]["p95_queue_wait_us_median"]
              waits = [summary["arms"][f"elastic-{budget}"]["32x32"]["per_class"][name]["p95_queue_wait_us_median"]
                       for budget in budgets]
              rows.append(f"| {name} | {dedicated_wait:,.1f} | {waits[0]:,.1f} | {waits[1]:,.1f} | {waits[2]:,.1f} |")
          rows += ["", "## Per-class p95 client-observed latency at 32 clients / depth 32", "",
                   "| Class | Dedicated (ms) | Elastic 1 (ms) | Elastic 2 (ms) | Elastic 4 (ms) |",
                   "|---|---:|---:|---:|---:|"]
          for name in classes:
              dedicated_latency = summary["arms"]["merged-dedicated"]["32x32"]["per_class"][name]["p95_latency_ms_median"]
              latencies = [summary["arms"][f"elastic-{budget}"]["32x32"]["per_class"][name]["p95_latency_ms_median"]
                           for budget in budgets]
              rows.append(f"| {name} | {dedicated_latency:,.3f} | {latencies[0]:,.3f} | {latencies[1]:,.3f} | {latencies[2]:,.3f} |")
          rows += ["", "## Throughput dispersion at 32 clients / depth 32 (MAD %)", "",
                   "| Arm | Throughput MAD |",
                   "|---|---:|"]
          for arm in arms:
              mad = summary["arms"][arm]["32x32"]["requests_per_second_mad_pct"]
              rows.append(f"| {arm} | {mad:.2f}% |")
          rows += ["", "## Process resource medians across repetitions", "",
                   "| Arm | Mean CPU (% of one logical CPU) | Peak RSS (MiB) |",
                   "|---|---:|---:|"]
          for arm in arms:
              samples = list(summary["resources"][arm].values())
              cpu = [x["mean_cpu_percent_one_core"] for x in samples
                     if x["mean_cpu_percent_one_core"] is not None]
              rss = [x["peak_rss_mib"] for x in samples if x["peak_rss_mib"] is not None]
              cpu_median = statistics.median(cpu) if cpu else float("nan")
              rss_median = statistics.median(rss) if rss else float("nan")
              summary.setdefault("resource_medians", {})[arm] = {
                  "mean_cpu_percent_one_core_median": cpu_median if math.isfinite(cpu_median) else None,
                  "peak_rss_mib_median": rss_median if math.isfinite(rss_median) else None,
              }
              rows.append(f"| {arm} | {cpu_median:.2f} | {rss_median:.2f} |")

          rows += ["", "## NUMA validation", "",
                   f"Runner NUMA nodes: {topology['numa_node_count']}",
                   f"Multi-node worker execution verified: {numa_verified}", "",
                   "| Arm | Class | Observed worker NUMA nodes |",
                   "|---|---|---|"]
          for arm in numa_nodes:
              for name in eligible:
                  rows.append(f"| {arm} | {name} | {numa_nodes[arm][name]} |")
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          (root / "summary.md").write_text("\n".join(rows) + "\n")
          print((root / "summary.md").read_text())
          if topology["runner_profile"] == "numa2" and not numa_verified:
              raise SystemExit("NUMA profile requested, but dedicated and elastic-4 workers were not observed on at least two NUMA nodes for every eligible class")
          PY
          cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-topology.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw trials and report
        uses: actions/upload-artifact@v7
        with:
          name: worker-fabric-mixed-class-saturation
          path: |
            benchmark-results/
            benchmark-topology.txt
            benchmark-topology.json
          if-no-files-found: error
          retention-days: 30
