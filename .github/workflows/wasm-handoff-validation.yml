name: Authenticated WASM Handoff Validation

on:
  push:
    branches: ["main"]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "protocol/**"
      - "tests/**"
      - ".github/workflows/wasm-handoff-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "protocol/**"
      - "tests/**"
      - ".github/workflows/wasm-handoff-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiver-conformance:
    name: Compile and test authenticated WASM receiver (CPU-only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev

      - name: Configure receiver and broker
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CUDA=OFF \
            -DENABLE_TENSORRT=OFF \
            -DENABLE_WASM_HANDOFF=ON \
            -DBUILD_BROKER=ON \
            -DBUILD_EXAMPLES=OFF

      - name: Build receiver conformance test
        run: cmake --build build --target wasm_handoff_receiver_test --parallel 2

      - name: Run receiver conformance tests
        run: ctest --test-dir build --output-on-failure --timeout 180 -R wasm_handoff_receiver_test
