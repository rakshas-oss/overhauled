name: Conan Package Validation

on:
  push:
    branches: ["main"]
    paths:
      - "conanfile.py"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - ".github/workflows/conan-package-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "conanfile.py"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - ".github/workflows/conan-package-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conan-package:
    name: Build Conan 2 package
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Overhauled
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Conan in an isolated virtual environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/conan-venv"
          "$RUNNER_TEMP/conan-venv/bin/pip" install "conan>=2,<3"
          echo "$RUNNER_TEMP/conan-venv/bin" >> "$GITHUB_PATH"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Build and package nvlink_placement
        run: conan create . --build=missing
